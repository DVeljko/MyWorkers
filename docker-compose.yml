services:

  department_service:
    build: ./department_service
    ports:
      - "5001:5001"
    env_file:
      - ./department_service/.env
    volumes:
      - ./department_service/migrations:/app/migrations
      - ./department_service/instance:/app/instance

  employee_service:
    build: ./employee_service
    ports:
      - "5002:5002"
    env_file:
      - ./employee_service/.env
    volumes:
      - ./employee_service/migrations:/app/migrations
      - ./employee_service/instance:/app/instance



  attendance_service:
    build: ./attendance_service

    ports:
      - "5003:5003"

    env_file:
      - ./attendance_service/.env

    volumes:
      - ./attendance_service/migrations:/app/migrations
      - ./attendance_service/instance:/app/instance


      
  auth_service:
    build: ./auth_service
    ports:
      - "5004:5004"
    env_file:
      - ./auth_service/.env
    volumes:
      - ./auth_service/migrations:/app/migrations
      - ./auth_service/instance:/app/instance

      

  web_service:
    build: ./web_service
    ports:
      - "8000:5000"
    env_file:
      - ./web_service/.env