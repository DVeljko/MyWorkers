name: MyWorkers CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r auth_service/requirements.txt
          pip install -r employee_service/requirements.txt
          pip install -r department_service/requirements.txt
          pip install -r attendance_service/requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest